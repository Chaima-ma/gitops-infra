apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardiomegaly-ingress
  namespace: healthview-cardiomegaly-cnn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - cardiomegaly-cnn.mlthrive.com
        - api-cardiomegaly.mlthrive.com
      secretName: cardiomegaly-mlthrive-tls

  rules:
    - host: cardiomegaly-cnn.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardiomegaly-frontend-service
                port:
                  number: 80

    - host: api-cardiomegaly.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardiomegaly-backend-service
                port:
                  number: 8000
