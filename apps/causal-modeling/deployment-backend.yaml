apiVersion: apps/v1
kind: Deployment
metadata:
 name: causal-modeling-backend
 namespace: causal-modeling
 labels:
    app: causal-modeling-backend
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: causal-modeling-backend
  template:
    metadata:
      labels:
        app: causal-modeling-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: causal-modeling-backend
        image: ghcr.io/curatimexai/causal-modeling-backend:ef9e0b2a7e77071158c62e92b35af9790b8f0ddb

        ports:
        - containerPort: 8000
        startupProbe:
          tcpSocket:
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10