apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: causal-modeling-ingress
  namespace: causal-modeling
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - causal-modeling.mlthrive.com
        - api-causal-modeling.mlthrive.com
      secretName: causal-modeling-mlthrive-tls

  rules:
    - host: causal-modeling.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: causal-modeling-service-frontend
                port:
                  number: 3000

    - host: api-causal-modeling.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: causal-modeling-service-backend
                port:
                  number: 8000