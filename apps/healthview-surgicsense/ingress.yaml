apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthview-surgicsense
  namespace: healthview-surgicsense
  labels:
    app.kubernetes.io/name: healthview-surgicsense
    app.kubernetes.io/part-of: healthview
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - surgicsense.nightingaleheart.com
        - api.surgicsense.nightingaleheart.com
      secretName: surgicsense-tls

    - hosts:
        - surgicsense.mlthrive.com
        - api.surgicsense.mlthrive.com
      secretName: surgicsense-mlthrive-tls

  rules:
    - host: surgicsense.nightingaleheart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthview-surgicsense-frontend
                port:
                  number: 8080

    - host: api.surgicsense.nightingaleheart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthview-surgicsense-backend
                port:
                  number: 8000

    - host: surgicsense.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthview-surgicsense-frontend
                port:
                  number: 8080

    - host: api.surgicsense.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthview-surgicsense-backend
                port:
                  number: 8000
