apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echogame-ingress
  namespace: healthview-echogame
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - echogame.mlthrive.com
        - api-echogame.mlthrive.com
      secretName: echogame-mlthrive-tls

  rules:
    - host: echogame.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echogame-frontend-service
                port:
                  number: 80

    - host: api-echogame.mlthrive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echogame-backend-service
                port:
                  number: 5000
